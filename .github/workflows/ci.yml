name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint .
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      BZZORIO_API_KEY: fake
      BZZORIO_BASE_URL: https://example.com/
      DB_URL: postgresql+asyncpg://fake:fake@localhost:5432/fake
      REDIS_URL: redis://localhost:6379
      POSTGRES_USER: fake
      POSTGRES_PASSWORD: fake
      POSTGRES_DB: fake
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fake
          POSTGRES_PASS: fake
          POSTGRES_DB: mezzala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -c "import backend.app.main"
      - run: python -c "import poller.poller"
